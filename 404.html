<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Page not found · AI Impact Tracker</title>
<link rel="icon" type="image/x-icon" href="favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --green-dk: #2B6327; --green-dker:#1F4A1C;
    --ink: #28201E; --ink-2: #4A413E; --muted: #64726B;
    --line: #E2EAD9; --surface: #F4F8EF; --card: #FFFFFF;
    --r-lg: 22px;
    --f-display: 'Avenir Next', 'Avenir', 'Poppins', system-ui, sans-serif;
    --f-body: 'Lato', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: var(--f-body); color: var(--ink); background: var(--surface); padding: 24px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
    max-width: 460px; width: 100%; padding: 44px 36px; text-align: center;
    box-shadow: 0 1px 2px rgba(51,64,58,.05), 0 12px 30px -14px rgba(51,64,58,.20);
  }
  .code { font-family: var(--f-display); font-weight: 700; font-size: 56px; letter-spacing: -0.02em; color: var(--green-dk); margin: 0 0 4px; }
  h1 { font-family: var(--f-display); font-weight: 600; font-size: 21px; letter-spacing: -0.01em; margin: 0 0 10px; }
  p { font-size: 14.5px; line-height: 1.55; color: var(--muted); margin: 0 0 28px; }
  a.btn {
    display: inline-block; text-decoration: none; background: var(--green-dk); color: #fff;
    font-family: var(--f-body); font-weight: 700; font-size: 14.5px; padding: 12px 26px;
    border-radius: 12px; transition: background 120ms ease, transform 120ms ease;
  }
  a.btn:hover { background: var(--green-dker); transform: translateY(-1px); }
</style>
</head>
<body>
  <div class="card">
    <p class="code">404</p>
    <h1>This page doesn't exist</h1>
    <p>The page you're looking for may have moved or the link may be out of date.</p>
    <a class="btn" href="tracker.html">Back to the Impact Tracker</a>
  </div>
</body>
</html>
